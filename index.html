<!DOCTYPE html>
<html lang="id" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EEF2F6">
<title>TOKO MEDIA — Media Nusantara</title>
<meta name="description" content="Pusat media rohani, film, video, dan aplikasi Kitab Suci dalam 177 bahasa daerah Nusantara.">
<meta property="og:title" content="TOKO MEDIA — Media Nusantara">
<meta property="og:description" content="Pusat media rohani, film, video, dan aplikasi Kitab Suci dalam 177 bahasa daerah Nusantara.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://suwandhih.github.io/TokoMedia/">
<meta name="twitter:title" content="TOKO MEDIA — Media Nusantara">
<meta name="twitter:description" content="Pusat media rohani, film, video, dan aplikasi Kitab Suci dalam 177 bahasa daerah Nusantara.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ECF1F7;
  --bg-mesh-1: rgba(16, 185, 129, 0.22);
  --bg-mesh-2: rgba(99, 102, 241, 0.18);
  --bg-mesh-3: rgba(14, 165, 233, 0.16);
  --glass: rgba(255, 255, 255, 0.78);
  --glass-strong: rgba(255, 255, 255, 0.92);
  --glass-subtle: rgba(255, 255, 255, 0.58);
  --glass-border: rgba(15, 23, 42, 0.08);
  --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  --text: #0F172A;
  --text-secondary: #334155;
  --muted: #64748B;
  --primary: #059669;
  --primary-light: #10B981;
  --primary-soft: rgba(5, 150, 105, 0.12);
  --primary-contrast: #FFFFFF;
  --accent: #4F46E5;
  --danger: #E11D48;
  --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 16px 40px rgba(15, 23, 42, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
  --radius-xl: 32px;
  --radius-lg: 26px;
  --radius-md: 20px;
  --radius-sm: 14px;
  --font-display: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

html[data-mode="dark"] {
  --bg: #080C14;
  --bg-mesh-1: rgba(16, 185, 129, 0.16);
  --bg-mesh-2: rgba(79, 70, 229, 0.16);
  --bg-mesh-3: rgba(14, 165, 233, 0.12);
  --glass: rgba(17, 24, 39, 0.76);
  --glass-strong: rgba(17, 24, 39, 0.92);
  --glass-subtle: rgba(30, 41, 59, 0.55);
  --glass-border: rgba(255, 255, 255, 0.09);
  --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  --text: #F8FAFC;
  --text-secondary: #CBD5E1;
  --muted: #94A3B8;
  --primary: #10B981;
  --primary-light: #34D399;
  --primary-soft: rgba(16, 185, 129, 0.16);
  --primary-contrast: #03150E;
  --accent: #818CF8;
  --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --shadow-lg: 0 28px 70px rgba(0, 0, 0, 0.65);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }

/* Spatial Ambient Mesh Background */
.spatial-mesh {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.mesh-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
}
.mesh-blob--1 {
  width: 560px; height: 560px;
  top: -180px; left: -120px;
  background: var(--bg-mesh-1);
}
.mesh-blob--2 {
  width: 520px; height: 520px;
  top: 25%; right: -160px;
  background: var(--bg-mesh-2);
}
.mesh-blob--3 {
  width: 480px; height: 480px;
  bottom: -140px; left: 20%;
  background: var(--bg-mesh-3);
}

/* Viewport Frame Switcher (Allows testing Desktop/Tablet vs Mobile 430px) */
.stage-wrapper {
  position: relative;
  z-index: 1;
  transition: max-width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.stage-wrapper.mobile-frame {
  max-width: 450px;
  margin: 20px auto 40px;
  border-radius: 44px;
  border: 8px solid #1E293B;
  box-shadow: 0 32px 90px rgba(0, 0, 0, 0.38);
  overflow: hidden;
  background: var(--bg);
}
.stage-wrapper.mobile-frame .desktop-pills,
.stage-wrapper.mobile-frame .search-pill-btn__label,
.stage-wrapper.mobile-frame .search-pill-btn kbd {
  display: none !important;
}
.stage-wrapper.mobile-frame .topbar__row {
  padding: 10px 14px;
  gap: 8px;
}
.stage-wrapper.mobile-frame .topbar__left {
  gap: 8px;
  min-width: 0;
}
.stage-wrapper.mobile-frame .glass-icon-btn,
.stage-wrapper.mobile-frame .search-pill-btn {
  width: 38px;
  height: 38px;
  padding: 0;
  justify-content: center;
  flex: none;
}
.stage-wrapper.mobile-frame .brand-link {
  gap: 8px;
  min-width: 0;
}
.stage-wrapper.mobile-frame .brand-svg-logo {
  height: 25px;
  width: auto;
  max-width: 130px;
  flex: none;
}
.stage-wrapper.mobile-frame .brand-link__tag {
  font-size: 8px;
  letter-spacing: 0.1em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stage-wrapper.mobile-frame .crumbs-ribbon {
  padding: 7px 14px;
  gap: 8px;
}

.app-container {
  max-width: 1260px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 104px;
}

/* Top Spatial Glass Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: var(--glass-highlight);
}
.topbar__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
}
.topbar__left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.glass-icon-btn {
  width: 42px; height: 42px;
  flex: none;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
  box-shadow: var(--shadow-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease;
}
.glass-icon-btn:hover {
  transform: translateY(-1px);
  border-color: var(--primary);
}
.brand-link {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 2px;
  flex-shrink: 0;
  text-decoration: none;
}
.brand-svg-logo {
  height: 26px;
  width: auto;
  max-width: 140px;
  display: block;
  flex: none;
  color: var(--text);
  overflow: visible;
}
.brand-link__text {
  display: block;
  line-height: 1;
}
.brand-link__tag {
  font-family: var(--font-mono);
  font-size: 7.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

.desktop-pills {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--glass-subtle);
  border: 1px solid var(--glass-border);
  flex-shrink: 0;
}
@media (min-width: 1080px) {
  .desktop-pills { display: inline-flex; }
}
.dpill {
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  transition: all 0.2s;
}
.dpill:hover, .dpill.active {
  background: var(--primary);
  color: var(--primary-contrast);
  box-shadow: 0 4px 12px rgba(5, 150, 105, 0.28);
}

.topbar__actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.search-pill-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 42px;
  padding: 0 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
  color: var(--muted);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.search-pill-btn svg { flex: none; }
.search-pill-btn:hover {
  border-color: var(--primary);
  color: var(--text);
}
.search-pill-btn__label {
  font-size: 13px;
  font-weight: 500;
  display: none;
  white-space: nowrap;
}
@media (min-width: 640px) and (max-width: 1079px), (min-width: 1180px) {
  .search-pill-btn__label { display: inline; }
}
.search-pill-btn kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--glass-subtle);
  border: 1px solid var(--glass-border);
  display: none;
}
@media (min-width: 640px) {
  .search-pill-btn kbd { display: inline-block; }
}
@media (max-width: 520px) {
  .topbar__row { padding: 10px 14px; gap: 8px; }
  .glass-icon-btn, .search-pill-btn { width: 38px; height: 38px; padding: 0; }
  .brand-link__title { font-size: 16px; }
  .brand-link__tag { font-size: 8.5px; letter-spacing: 0.08em; }
}

/* Breadcrumbs Ribbon */
.crumbs-ribbon {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 20px;
  border-top: 1px solid var(--glass-border);
  background: var(--glass-subtle);
  font-size: 12.5px;
}
.crumbs-list {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}
.crumbs-list::-webkit-scrollbar { display: none; }
.crumb-a {
  color: var(--muted);
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 8px;
  transition: background 0.15s, color 0.15s;
}
.crumb-a:hover {
  background: var(--primary-soft);
  color: var(--primary);
}
.crumb-sep { color: var(--muted); opacity: 0.45; }
.crumb-now {
  color: var(--text);
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 8px;
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
}
.crumbs-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
.mini-chip-btn {
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
}
.mini-chip-btn.active, .mini-chip-btn:hover {
  color: var(--primary);
  border-color: var(--primary);
}

/* Slide-Out Spatial Drawer */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s ease;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 12px; bottom: 12px; left: 12px;
  z-index: 70;
  width: min(86vw, 340px);
  border-radius: var(--radius-xl);
  background: var(--glass-strong);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-lg);
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transform: translateX(-115%);
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
}
.drawer.open { transform: translateX(0); }
.drawer__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--glass-border);
}
.drawer__nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 16px 0;
}
.drawer-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 14px;
  transition: all 0.2s;
}
.drawer-item:hover {
  background: var(--primary-soft);
  color: var(--primary);
  transform: translateX(4px);
}
.drawer__foot {
  padding-top: 14px;
  border-top: 1px solid var(--glass-border);
  font-size: 12px;
  color: var(--muted);
}
.drawer__foot-links {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 8px;
}
.drawer__foot-links a {
  font-weight: 700;
  color: var(--text-secondary);
}
.drawer__foot-links a:hover { color: var(--primary); }

/* Expandable Search Bar */
.search-sheet {
  position: sticky;
  top: 97px;
  z-index: 38;
  padding: 12px 20px;
  background: var(--glass-strong);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: var(--shadow-md);
}
.search-sheet__form {
  max-width: 780px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
}
.search-sheet__input {
  flex: 1;
  height: 46px;
  padding: 0 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  outline: none;
}
.search-sheet__input:focus { border-color: var(--primary); }
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 22px;
  height: 46px;
  border-radius: var(--radius-sm);
  border: 0;
  background: var(--primary);
  color: var(--primary-contrast);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(5, 150, 105, 0.25);
  transition: transform 0.18s ease;
}
.btn-primary:hover { transform: translateY(-1px); }

/* Main Content Layout */
main {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* Spatial Hero Bento Card */
.hero-bento {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.hero-main-card {
  position: relative;
  border-radius: var(--radius-xl);
  padding: clamp(24px, 4vw, 42px);
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 18px;
}
.hero-main-card__bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: radial-gradient(circle at 85% 20%, rgba(16, 185, 129, 0.22), transparent 55%),
              radial-gradient(circle at 15% 85%, rgba(79, 70, 229, 0.15), transparent 55%);
}
.hero-main-card__content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.spatial-pill {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.spatial-pill__dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--primary);
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(26px, 3.8vw, 44px);
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: -0.025em;
}
.hero-desc {
  font-size: 14.5px;
  color: var(--text-secondary);
  max-width: 56ch;
}
.hero-cta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
}
.btn-glass {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 46px;
  padding: 0 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-glass:hover {
  border-color: var(--primary);
  transform: translateY(-1px);
}

.hero-stats-Side {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.stat-bento {
  border-radius: var(--radius-lg);
  padding: 20px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.stat-bento__tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}
.stat-bento__num {
  font-family: var(--font-display);
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 800;
  color: var(--primary);
  margin: 8px 0 2px;
}
.stat-bento__label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* Section Headers */
.sec-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.sec-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--primary);
  display: block;
  margin-bottom: 3px;
}
.sec-title {
  font-family: var(--font-display);
  font-size: clamp(20px, 2.6vw, 28px);
  font-weight: 800;
  letter-spacing: -0.02em;
}
.sec-sub {
  font-size: 13px;
  color: var(--muted);
}

/* Category Bento Cards (5 Categories) */
.cat-bento-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.cat-bento-card:nth-child(1) {
  grid-column: 1 / -1;
}
.cat-bento-card:nth-child(2),
.cat-bento-card:nth-child(3),
.cat-bento-card:nth-child(4),
.cat-bento-card:nth-child(5) {
  grid-column: span 1;
}

.cat-bento-card {
  position: relative;
  border-radius: var(--radius-lg);
  padding: 20px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 162px;
  overflow: hidden;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s;
}
.cat-bento-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--card-grad);
  pointer-events: none;
}
.cat-bento-card:hover {
  transform: translateY(-4px);
  border-color: var(--card-accent);
}
.cat-bento-card__top, .cat-bento-card__mid, .cat-bento-card__bot {
  position: relative;
  z-index: 1;
}
.cat-bento-card__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.cat-icon-box {
  width: 40px; height: 40px;
  border-radius: 13px;
  background: var(--icon-bg);
  color: #fff;
  display: grid;
  place-items: center;
  box-shadow: 0 6px 14px rgba(0,0,0,0.12);
}
.cat-badge-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
  color: var(--text-secondary);
}
.cat-bento-card__mid { margin: 14px 0; }
.cat-bento-card__title {

],["p","Kebijakan Privasi ini menjelaskan sifat, cakupan, dan tujuan pemrosesan data pribadi dalam penawaran daring kami dan situs web, fitur, dan konten terkait."],["h","Tokomedia.org mengatur bagaimana informasi pribadi Anda ditangani."],["p","‘Informasi pribadi’ berarti informasi atau pendapat tentang individu yang teridentifikasi, atau individu yang dapat diidentifikasi secara wajar. Kebijakan Privasi Tokomedia.org berlaku untuk informasi pribadi yang dikumpulkan dan/atau disimpan oleh Tokomedia.org."],["p","Kami akan meninjau kebijakan ini secara berkala, dan kami dapat memperbaruinya dari waktu ke waktu."],["h","Jenis informasi pribadi yang kami kumpulkan dan simpan"],["p","Kami mengumpulkan informasi pribadi tentang pengguna kami untuk menyediakan layanan pelanggan kepada pengguna kami. Layanan, dan dukungan pelanggan kami disediakan melalui banyak platform, termasuk, antara lain, situs web, aplikasi telepon, dan email. Platform dan produk, layanan, atau dukungan tertentu yang Anda gunakan dapat mempengaruhi data pribadi yang kami kumpulkan."],["p","Tidak semua informasi yang diminta, dikumpulkan, dan diproses oleh kami adalah \"Informasi Pribadi\" karena tidak mengidentifikasi Anda sebagai individu tertentu. \"Informasi nonpribadi\" ini tidak tercakup dalam kebijakan privasi ini. Namun, karena informasi nonpribadi dapat digunakan secara global atau mungkin terkait dengan informasi pribadi yang ada; ketika dalam bentuk ini akan diperlakukan sebagai informasi pribadi. Dengan demikian, kebijakan privasi ini akan mencantumkan kedua jenis informasi demi transparansi."],["p","Dalam beberapa kasus, pengguna dapat memberi kami informasi pribadi tanpa kami memintanya, atau dengan cara yang tidak dimaksudkan untuk pengumpulan jenis informasi tertentu. Meskipun kami dapat mengambil langkah-langkah yang wajar untuk melindungi data tersebut, pengguna akan melewati sistem, proses, dan kontrol kami dan, oleh karena itu, informasi yang diberikan tidak akan diatur oleh kebijakan privasi ini."],["p","Dalam situasi tertentu, pengguna dapat memberi kami informasi pribadi di platform di luar kendali kami; misalnya melalui jejaring sosial atau forum. Meskipun informasi yang kami kumpulkan diatur oleh kebijakan privasi ini, platform yang digunakan untuk mengomunikasikannya akan diatur oleh kebijakan privasinya sendiri."],["h","Bagaimana kami mengumpulkan informasi pribadi"],["p","Saat Anda menggunakan layanan kami, Anda mungkin diminta untuk memberikan jenis informasi pribadi tertentu. Ini dapat terjadi melalui situs web kami, aplikasi kami, sistem obrolan daring kami, atau aplikasi chat."],["p","Kami dapat meminta, mengumpulkan, atau memproses informasi berikut:"],["li","Detail Kontak – alamat email, nomor telepon"],["li","Detail Identitas – nama lengkap"],["li","Data Konten – input teks, foto, video"],["li","Buku-buku yang dibaca."],["p","Kami menyimpan catatan interaksi yang kami lakukan dengan pengguna kami, termasuk layanan, dan dukungan pelanggan yang telah kami berikan. Ini termasuk interaksi yang dilakukan pengguna dengan platform kami, seperti saat pengguna melihat halaman atau mengeklik tombol."],["p","Saat Anda menghubungi kami, kami dapat mengumpulkan informasi pribadi yang penting bagi komunikasi tersebut. Misalnya, jika Anda menghubungi kami melalui email, kami akan mengumpulkan alamat email yang digunakan."],["h","Kami dapat mengumpulkan atau memproses informasi berikut:"],["li","Metadata – alamat IP, informasi komputer dan koneksi, halaman web rujukan, informasi log web standar, pengaturan bahasa, zona waktu, dll."],["li","Informasi Perangkat – pengenal perangkat, jenis perangkat, plugin perangkat, kemampuan perangkat keras, dll."],["li","Tindakan – halaman yang dilihat, tombol yang diklik, waktu yang dihabiskan untuk melihat, kata kunci pencarian, dll."],["li","Data Penggunaan – situs web yang dikunjungi, minat terhadap konten, waktu akses"],["h","Cookie"],["p","Kami, dan pihak ketiga yang menjadi mitra kami, dapat menggunakan cookie, suar web, tag, skrip, objek bersama lokal seperti HTML5 dan Flash (terkadang disebut \"cookie flash\"), pengenal iklan (termasuk pengenal seluler seperti IDFA Apple atau ID Iklan Google) dan teknologi serupa (\"Cookie\") sehubungan dengan penggunaan situs web kami, situs web pihak ketiga, dan aplikasi seluler. Cookie mungkin memiliki pengenal unik dan berada, antara lain, di komputer atau perangkat seluler Anda, di email yang kami kirim kepada Anda, dan di halaman web kami. Cookie dapat mengirimkan informasi tentang Anda dan penggunaan situs web kami, seperti jenis browser, preferensi pencarian, alamat IP, data yang berkaitan dengan iklan yang telah ditampilkan kepada Anda atau yang telah Anda klik, serta tanggal dan waktu penggunaan Anda. Cookie dapat bersifat persisten atau disimpan hanya selama sesi tertentu."],["h","Tujuan penggunaan cookie di situs web kami meliputi:"],["li","Tujuan: Penjelasan"],["li","Proses: Ditujukan untuk membuat situs web dan layanan kami berfungsi sesuai harapan Anda."],["li","Autentikasi, Keamanan, dan Kepatuhan: Ditujukan untuk mencegah penipuan, melindungi data Anda dari semua pihak yang tidak berwenang, dan mematuhi persyaratan."],["li","Preferensi: Ditujukan untuk membantu mengingat informasi tentang bagaimana Anda lebih suka situs web berperilaku dan terlihat."],["li","Pemberitahuan: Ditujukan untuk mengizinkan atau mencegah pemberitahuan informasi atau opsi yang menurut kami dapat meningkatkan penggunaan situs web kami. Misalnya, kami mungkin menggunakan Cookie yang menghentikan kami menampilkan pemberitahuan pendaftaran email jika Anda telah melihatnya."],["li","Analisis: Ditujukan untuk membantu kami memahami bagaimana pengunjung menggunakan situs web kami. Misalnya, kami mungkin menggunakan Cookie yang memberi tahu kami bagaimana saran pencarian kami berkorelasi dengan interaksi Anda dengan halaman pencarian."],["p","Anda dapat mengatur beberapa preferensi Cookie melalui pengaturan perangkat atau browser Anda, tetapi hal itu dapat memengaruhi fungsionalitas situs web kami. Metode untuk menonaktifkan Cookie dapat bervariasi menurut perangkat dan browser, tetapi biasanya dapat ditemukan di preferensi perangkat atau browser atau pengaturan keamanan Anda. Misalnya, perangkat iOS dan Android masing-masing memiliki pengaturan yang dirancang untuk membatasi bentuk pelacakan iklan. Harap perhatikan bahwa mengubah pengaturan ini tidak mencegah penayangan iklan tertentu kepada Anda."],["h","Tautan ke situs lain"],["p","Di situs web kami, Anda akan menemukan tautan ke situs web pihak ketiga. Tautan ini mungkin berasal dari kami, atau mungkin muncul sebagai konten yang dibuat oleh pengguna lain. Situs yang ditautkan ini tidak berada di bawah kendali kami dan dengan demikian kami tidak bertanggung jawab atas tindakan mereka. Sebelum memberikan informasi pribadi Anda melalui situs web lain, kami menyarankan Anda untuk memeriksa syarat dan ketentuan penggunaan situs web tersebut dan kebijakan privasinya."],["h","Penyedia layanan pihak ketiga kami"],["p","Informasi pribadi pengguna dapat disimpan atau diproses atas nama kami di luar Indonesia, termasuk 'di cloud', oleh penyedia layanan pihak ketiga kami. Penyedia layanan pihak ketiga kami terikat kontrak untuk hanya menggunakan informasi pribadi Anda atas nama kami, sesuai instruksi kami."],["p","Penyedia layanan pihak ketiga kami meliputi:"],["li","Penyedia kolokasi"],["li","Penyedia pesan email"],["li","Penyedia pemasaran dan analitik"],["li","Penyedia keamanan"],["li","Aplikasi pihak ketiga"],["h","Keamanan"],["p","Kami menggunakan berbagai perlindungan untuk melindungi informasi pribadi yang dikirimkan kepada kami, baik selama transmisi maupun setelah kami menerimanya. Namun, tidak ada metode transmisi melalui Internet atau melalui perangkat seluler, atau metode penyimpanan elektronik, yang 100% aman. Oleh karena itu, meskipun kami berupaya menggunakan cara yang dapat diterima secara komersial untuk melindungi informasi pribadi Anda, kami <script>
(function () {
  var P = window.TM_PAYLOAD;

  // ---------------------------------------------------------------------------
  // Konfigurasi API
  // Token API TIDAK disimpan di repositori ini. Nilainya diisi lewat berkas
  // `config.local.js` (tidak ikut Git) atau lewat window.TM_CONFIG sebelum
  // skrip ini dimuat. Untuk pengujian lokal tambahkan ?api=http://localhost:8080/api
  // pada URL halaman.
  // ---------------------------------------------------------------------------
  var TOKEN_KEY = 'tm.apiToken';
  var savedToken = '';
  try { savedToken = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { savedToken = ''; }
  var TM_CONFIG = {
    apiBase: 'https://suwandhih.my.id/index.php/api',
    token: (window.TM_CONFIG && window.TM_CONFIG.token) || savedToken
  };
  var API_OVERRIDE = new URLSearchParams(location.search).get('api');
  if (API_OVERRIDE) TM_CONFIG.apiBase = API_OVERRIDE.replace(/\/+$/, '');

  var SITE = P.app.siteUrl;
  var CHANNEL = P.app.channel;
  var SEARCH_URL = SITE + '/search/v/';
  var appMain = document.getElementById('appMain');
  var crumbsEl = document.getElementById('crumbs');
  var backBtn = document.getElementById('backBtn');
  var drawer = document.getElementById('drawer');
  var scrim = document.getElementById('scrim');
  var searchSheet = document.getElementById('searchSheet');
  var searchInput = document.getElementById('searchInput');
  var stageWrapper = document.getElementById('stageWrapper');

  // ---------------------------------------------------------------------------
  // Store data runtime.
  // Nilai awal = payload tertanam, lalu ditimpa data API bila tersedia.
  // ---------------------------------------------------------------------------
  var TM = {
    tree: null,
    categories: P.categories,
    regions: P.regions,
    homeLanguages: P.homeLanguages,
    latestVideos: P.latestVideos,
    apps: P.apps,
    watch: null,
    loaded: {}
  };

  // Root kategori di database untuk setiap slug kategori pada UI.
  var CATEGORY_ROOT = {
    'film-riwayat-isa-al-masih': 1,
    'video': 126,
    'clip': 127,
    'film-ikatan-ilahi': 304
  };

  function apiPost(path, params) {
    var body = new URLSearchParams();
    body.set('path', path);
    if (TM_CONFIG.token) body.set('token', TM_CONFIG.token);
    Object.keys(params || {}).forEach(function (key) {
      var value = params[key];
      if (value !== undefined && value !== null) body.set(key, value);
    });
    return fetch('https://suwandhih.my.id/tm-bridge.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body: body.toString()
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (json) {
      if (!json || typeof json.status === 'undefined') throw new Error('Respons API tidak valid');
      return json;
    });
  }

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function shortDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return ('0' + d.getDate()).slice(-2) + ' ' + MONTHS[d.getMonth()] + ' ' + String(d.getFullYear()).slice(-2);
  }

  function shortSlug(slug) {
    var parts = String(slug || '').split('/');
    return parts[parts.length - 1];
  }

  function parseTags(tagging) {
    return String(tagging || '').split(/\s+/).filter(function (t) { return t; }).map(function (t) {
      return t.replace(/^#/, '');
    });
  }

  // Item daftar memakai `name`, item rekomendasi memakai `title`.
  function apiVideoToCard(item) {
    return {
      id: item.id,
      title: item.name || item.title || '',
      image: item.thumbnail || '',
      href: item.slug ? '/' + item.slug : '',
      duration: item.duration || '',
      views: Number(item.watchcounter || 0),
      date: item.dateschedule_iso || '',
      dateLabel: shortDate(item.dateschedule_iso)
    };
  }

  // Konten video di database memakai <br> sebagai pemisah baris.
  function plainText(html) {
    return String(html || '')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<[^>]+>/g, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  // Nama bahasa diambil dari segmen kedua slug, mis. "film-ikatan-ilahi/aceh/w/..."
  function languageLabelFromSlug(slug) {
    var parts = String(slug || '').split('/');
    if (parts.length < 2) return '';
    var entry = langMap.get(parts[1]);
    return entry ? entry.name : parts[1].replace(/-/g, ' ');
  }

  function currentRoute() {
    return decodeURIComponent(location.hash.replace(/^#/, '')) || 'home';
  }

  function rerenderIf(predicate) {
    if (predicate(currentRoute())) showRoute();
  }

  var langMap = new Map();
  var allLanguages = [];

  // Indeks bahasa untuk Beranda (A–Z & galeri ikon) hanya memakai Film Isa

  var HOME_ROOT_ID = 1;

  function rebuildLangIndex() {
    var all = new Map();
    var home = new Map();

    function add(target, name, slug, region, image) {
      if (!slug) return;
      var list = target.get(slug) || [];
      list.push({ name: name, slug: slug, region: region, image: image || '' });
      target.set(slug, list);
    }

    if (TM.tree) {
      TM.tree.forEach(function (root) {
        (root.children || []).forEach(function (region) {
          var langs = (region.children && region.children.length) ? region.children : [region];
          langs.forEach(function (l) {
            var slug = shortSlug(l.slug);
            add(all, l.name, slug, region.name, '');
            if (root.id === HOME_ROOT_ID) add(home, l.name, slug, region.name, '');
          });
        });
      });
    }
    TM.regions.forEach(function (r) {
      r.languages.forEach(function (l) {
        add(all, l.name, l.slug, r.name, '');
        add(home, l.name, l.slug, r.name, '');
      });
    });
    TM.homeLanguages.forEach(function (l) {
      add(all, l.name, l.slug, 'Nusantara', l.image);
      add(home, l.name, l.slug, 'Nusantara', l.image);
    });

    function pick(map) {
      var out = new Map();
      map.forEach(function (list, slug) {
        // Bila satu slug muncul beberapa kali, utamakan entri "Indonesia".
        out.set(slug, list.filter(function (c) { return c.name === 'Indonesia'; })[0] || list[0]);
      });
      return out;
    }

    langMap = pick(all);
    allLanguages = Array.from(pick(home).values()).sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  // Ambil daftar wilayah + bahasa untuk satu kategori dari pohon kategori API.
  // Anak root yang bernama "Indonesia" dijadikan Bahasa Nasional (bukan wilayah).
  function regionsForCategory(categorySlug) {
    var rootId = CATEGORY_ROOT[categorySlug];
    if (!TM.tree || !rootId) return null;
    var root = TM.tree.filter(function (n) { return n.id === rootId; })[0];
    if (!root) return null;

    var national = null;
    var regions = [];
    (root.children || []).forEach(function (child) {
      var kids = child.children || [];
      if (!national && /indonesia/i.test(child.name)) {
        national = { name: 'Indonesia', slug: shortSlug(child.slug) };
        return;
      }
      if (!kids.length) return;
      regions.push({
        name: child.name,
        languages: kids.map(function (l) { return { name: l.name, slug: shortSlug(l.slug) }; })
      });
    });
    return { national: national, regions: regions };
  }

    var fromApi = regionsForCategory(lastCategory);
    var national = fromApi ? fromApi.national : { name: 'Indonesia', slug: 'indonesia' };

  // Endpoint daftar video per kategori UI.

  function renderLanguageVideos(langSlug) {
    var langObj = langMap.get(langSlug) || { name: langSlug, region: 'Nusantara' };
    var category = lastCategory;
    var endpoint = VIDEO_ENDPOINT[category] || VIDEO_ENDPOINT['film-riwayat-isa-al-masih'];

    function paint(items, note) {
      var sorted = sortVideoItems(items);
      appMain.innerHTML =

      var sample = P.latestVideos[i % P.latestVideos.length] || {};

        views: v.views,
        date: v.date,
        dateLabel: v.dateLabel,
        image: sample.image || '',
        href: sample.href || ''

    });
    paint(fallback, '');

    var languagePref = String(langSlug || '').split('/').pop();
    var params = needsLang ? { id: languagePref, per_page: 100 } : { per_page: 100 };
    if (activeSort !== 'trending') params.sort = activeSort === 'unviral' ? 'unseen' : activeSort;
    apiPost(endpoint, params).then(function (json) {
      if (currentRoute() !== 'videos/' + langSlug) return;
      var items = (json.data || []).map(apiVideoToCard);
      if (!items.length) {
        paint([], json.message || 'Belum ada video untuk bahasa ini.');
        return;
      }
      paint(items, '');
    }).catch(function () {
      if (currentRoute() !== 'videos/' + langSlug) return;
      paint(fallback, 'Menampilkan data luring — server API belum dapat dihubungi.');
    });
  }

  var CAPTCHA_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function rnd(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }
  function drawCaptcha(box) {
    var code = '';
    for (var i = 0; i < 4; i++) code += CAPTCHA_CHARS.charAt(rnd(0, CAPTCHA_CHARS.length - 1));
    var svg = '<svg viewBox="0 0 120 40" aria-hidden="true">';
    for (var n = 0; n < 4; n++) {
      svg += '<line x1="' + rnd(0, 120) + '" y1="' + rnd(0, 40) + '" x2="' + rnd(0, 120) + '" y2="' + rnd(0, 40) + '" stroke="#94A3B8"/>';
    }
    for (var j = 0; j < code.length; j++) {
      var x = 10 + j * 27;
      svg += '<text x="' + x + '" y="' + rnd(24, 30) + '" transform="rotate(' + rnd(-18, 18) + ' ' + x + ' 25)" font-family="Arial,sans-serif" font-size="' + rnd(20, 24) + '" font-weight="700" fill="#0F172A">' + code.charAt(j) + '</text>';
    }
    box.innerHTML = svg + '</svg>';
    box.dataset.code = code;
  }
  function initCaptchas() {
    document.querySelectorAll('.captcha').forEach(drawCaptcha);
  }

  function renderCrumbs(key, current) {
    var catTitles = {};
    TM.categories.forEach(function (c) { catTitles[c.id] = c.title; });
    var items;
    if (key === 'home') {
      items = [['Beranda', null]];
    } else if (key.indexOf('languages/') === 0) {
      var cat = current.slice('languages/'.length);
      lastCategory = cat;
      items = [
        ['Beranda', '#home'],
        [catTitles[cat] || cat, '#languages/' + cat],
        [cat === 'app' ? 'Daftar Aplikasi' : 'Daftar Bahasa', null]
      ];
    } else if (key.indexOf('videos/') === 0) {
      var langSlug = current.slice('videos/'.length);
      var lObj = langMap.get(langSlug);
      items = [
        ['Beranda', '#home'],
        [catTitles[lastCategory] || lastCategory, '#languages/' + lastCategory],
        ['Daftar Bahasa', '#languages/' + lastCategory],
        [lObj ? lObj.name : langSlug, null]
      ];
    } else if (key === 'contact') {
      items = [['Beranda', '#home'], ['Kontak Kami', null]];
    } else if (key === 'privacy-web') {
      items = [['Beranda', '#home'], ['Kebijakan Privasi Situs', null]];
    } else if (key === 'privacy-app') {
      items = [['Beranda', '#home'], ['Kebijakan Privasi Aplikasi', null]];
    } else if (key === 'watch') {
      var origin = lastCrumbs[lastCrumbs.length - 1];
      items = lastCrumbs.slice(0, -1).concat([[origin[0], '#' + lastRoute], ['Detail Video', null]]);
    } else {
      var q = current === 'search' ? '' : current.slice('search/'.length);
      items = [['Beranda', '#home'], ['Pencarian “' + q + '”', null]];
    }
    if (key !== 'watch') {
      lastCrumbs = items;
      lastRoute = current;
    }
    crumbsEl.innerHTML = items.map(function (it, idx) {
      var sep = idx > 0 ? '<span class="crumb-sep">&rsaquo;</span>' : '';
      var node = it[1] ? '<a class="crumb-a" href="' + esc(it[1]) + '">' + esc(it[0]) + '</a>' : '<span class="crumb-now">' + esc(it[0]) + '</span>';
      return sep + node;
    }).join('');
  }

  function showRoute() {
    var current = decodeURIComponent(location.hash.replace(/^#/, '')) || 'home';
    var key = (current === 'search' || current.indexOf('search/') === 0) ? 'search' : current;

    drawer.classList.remove('open');
    scrim.classList.remove('open');
    searchSheet.hidden = true;
    backBtn.hidden = (key === 'home');
    window.scrollTo(0, 0);
    renderCrumbs(key, current);

    // Sync nav highlights
    document.querySelectorAll('.dock-item').forEach(function (el) {
      var d = el.dataset.dock;
      var on = (d === 'home' && key === 'home') ||
               (d === 'languages' && ((key.indexOf('languages/') === 0 && key !== 'languages/app') || key.indexOf('videos/') === 0)) ||
               (d === 'watch' && key === 'watch') ||
               (d === 'apps' && key === 'languages/app');
      el.classList.toggle('active', on);
    });
    document.querySelectorAll('.dpill').forEach(function (el) {
      var d = el.dataset.dpill;
      var on = (d === 'home' && key === 'home') ||
               (d === 'film' && ((key.indexOf('languages/') === 0 && key !== 'languages/app') || key.indexOf('videos/') === 0)) ||
               (d === 'app' && key === 'languages/app') ||
               (d === 'contact' && key === 'contact');
      el.classList.toggle('active', on);
    });

    if (key === 'home') renderHome();
    else if (key === 'languages/app') renderApps();
    else if (key.indexOf('languages/') === 0) renderRegions(current.slice('languages/'.length));
    else if (key.indexOf('videos/') === 0) renderLanguageVideos(current.slice('videos/'.length));
    else if (key === 'watch') renderWatch();
    else if (key === 'contact') renderContact();
    else if (key === 'privacy-web') renderLegal('privacyWeb', 'Kebijakan Privasi Situs');
    else if (key === 'privacy-app') renderLegal('privacyApp', 'Kebijakan Privasi Aplikasi');
    else if (key === 'search') renderSearch(current === 'search' ? '' : current.slice('search/'.length));
    else {
      location.replace('#home');
    }
  }

  document.addEventListener('click', function (e) {

    if (watchCard) {
      watchData = {
        title: watchCard.dataset.title || '',
        views: Number(watchCard.dataset.views || 0),
        dateLabel: watchCard.dataset.dateLabel || '',
        image: watchCard.dataset.image || '',
        href: watchCard.dataset.href || '',
        id: Number(watchCard.dataset.id || 0) || undefined,
        category: languageLabelFromSlug(watchCard.dataset.href) || P.watchExample.category,
        description: '',
        tags: []
      };
      return;
    }

    var letterBtn = e.target.closest('[data-letter]');
    if (letterBtn) {
      activeLetter = letterBtn.dataset.letter;
      renderHome();
      return;
    }

    var lviewBtn = e.target.closest('[data-lview]');
    if (lviewBtn) {
      langViewMode = lviewBtn.dataset.lview;
      renderHome();
      return;
    }

    var sortBtn = e.target.closest('[data-sort]');
    if (sortBtn) {
      activeSort = sortBtn.dataset.sort;
      showRoute();
      return;
    }

    var likeBtn = e.target.closest('.like-btn');
    if (likeBtn) {
      if (likeBtn.getAttribute('aria-pressed') === 'true') return;
      var likeId = (watchData && watchData.id) || 0;
      if (!likeId) {
        likeBtn.setAttribute('aria-pressed', 'true');
        return;
      }
      likeBtn.disabled = true;
      apiPost('other/likevideo', { id: likeId }).then(function (json) {
        likeBtn.setAttribute('aria-pressed', 'true');
        var total = json.data && json.data.totallike;
        if (total) {
          likeBtn.innerHTML = '&#9829; Suka &middot; ' + Number(total).toLocaleString('en-US');
          if (watchData) watchData.likes = total;
        }
      }).catch(function () {
        likeBtn.setAttribute('aria-pressed', 'true');
      }).then(function () {
        likeBtn.disabled = false;
      });
      return;
    }

    var refreshBtn = e.target.closest('.captcha-refresh');
    if (refreshBtn) {
      var row = refreshBtn.parentNode;
      drawCaptcha(row.querySelector('.captcha'));
      row.querySelector('input').value = '';
      return;
    }

    var vpBtn = e.target.closest('[data-vp]');
    if (vpBtn) {
      document.querySelectorAll('[data-vp]').forEach(function (b) { b.classList.toggle('active', b === vpBtn); });
      stageWrapper.classList.toggle('mobile-frame', vpBtn.dataset.vp === 'mobile');
      return;
    }

  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (!form.classList.contains('comment-form')) return;
    e.preventDefault();
    var status = form.querySelector('.form-status');
    var box = form.querySelector('.captcha');
    var input = form.querySelector('input[name="captcha"]');
    status.classList.remove('error');
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    if (input.value.trim().toUpperCase() !== box.dataset.code) {
      status.textContent = 'Kode validasi tidak sesuai. Silakan coba lagi.';
      status.classList.add('error');
      drawCaptcha(box);
      input.value = '';
      return;
    }

    var submitBtn = form.querySelector('button[type="submit"]');
    var isVideoForm = currentRoute() === 'watch';
    var payload = {
      contactname: (form.querySelector('[name="name"]') || {}).value || '',
      emailaddress: (form.querySelector('[name="email"]') || {}).value || '',
      phonenumber: (form.querySelector('[name="phone"]') || {}).value || '',
      messagecontent: (form.querySelector('[name="message"]') || {}).value || ''
    };
    var endpoint;
    if (isVideoForm) {
      endpoint = 'other/commentvideo';
      payload.videoid = (watchData && watchData.id) || '';
      payload.videotitle = (watchData && watchData.title) || '';
    } else {
      endpoint = 'contact';
      payload.linkid = 'web';
      payload.linkname = 'Website TokoMedia';
    }

    if (submitBtn) submitBtn.disabled = true;
    status.textContent = 'Mengirim...';

    apiPost(endpoint, payload).then(function (json) {
      if (json.status === 200) {
        status.classList.remove('error');
        status.textContent = json.message || 'Terima kasih, pesan Anda sudah terkirim.';
        form.reset();
        drawCaptcha(box);
      } else {
        status.classList.add('error');
        status.textContent = json.message || 'Pengiriman gagal. Silakan coba lagi.';
        drawCaptcha(box);
        input.value = '';
      }
    }).catch(function () {
      status.classList.add('error');
      status.textContent = 'Server belum dapat dihubungi. Silakan coba lagi nanti.';
      drawCaptcha(box);
      input.value = '';
    }).then(function () {
      if (submitBtn) submitBtn.disabled = false;
    });
  });

  document.getElementById('menuBtn').addEventListener('click', function () {
    drawer.classList.toggle('open');
    scrim.classList.toggle('open');
  });
  document.getElementById('closeDrawerBtn').addEventListener('click', function () {
    drawer.classList.remove('open');
    scrim.classList.remove('open');
  });
  scrim.addEventListener('click', function () {
    drawer.classList.remove('open');
    scrim.classList.remove('open');
  });
  backBtn.addEventListener('click', function () {
    if (history.length > 1) history.back();
    else location.hash = '#home';
  });

  document.getElementById('searchBtn').addEventListener('click', function () {
    searchSheet.hidden = !searchSheet.hidden;
    if (!searchSheet.hidden) searchInput.focus();
  });
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = searchInput.value.trim();
    if (!q) return;
    var target = '#search/' + encodeURIComponent(q);
    searchSheet.hidden = true;
    if (location.hash === target) showRoute();
    else location.hash = target;
  });

  document.getElementById('themeBtn').addEventListener('click', function () {
    var htmlEl = document.documentElement;
    var next = htmlEl.getAttribute('data-mode') === 'dark' ? 'light' : 'dark';
    htmlEl.setAttribute('data-mode', next);
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchInput && ['INPUT', 'TEXTAREA'].indexOf(document.activeElement.tagName) === -1) {
      e.preventDefault();
      searchSheet.hidden = false;
      searchInput.focus();
    }
  });

  window.addEventListener('hashchange', showRoute);
  showRoute();

  // ---------------------------------------------------------------------------
  // Muat data awal dari API. Halaman sudah tampil dengan data tertanam, jadi
  // kegagalan API tidak membuat UI kosong — hanya tetap memakai data luring.
  // ---------------------------------------------------------------------------
  function loadBootstrapData() {
    apiPost('category/tree', {}).then(function (json) {
      if (!json.data || !json.data.length) return;
      TM.tree = json.data;
      rebuildLangIndex();
      rerenderIf(function (route) {
        return route === 'home' || route.indexOf('languages/') === 0 || route.indexOf('videos/') === 0;
      });
    }).catch(function () { /* pakai data tertanam */ });

    apiPost('other/latestvideo', { per_page: 12 }).then(function (json) {
      var items = (json.data || []).map(apiVideoToCard);
      if (!items.length) return;
      TM.latestVideos = items;
      rerenderIf(function (route) { return route === 'home' || route === 'watch'; });
    }).catch(function () { /* pakai data tertanam */ });

    apiPost('aplikasi/list', { page: 1, per_page: 100 }).then(function (json) {
      var items = (json.data || []).map(function (a) {
        return { name: a.name, image: a.thumbnail, link: a.url };
      });
      if (!items.length) return;
      TM.apps = items;
      rerenderIf(function (route) { return route === 'languages/app'; });
    }).catch(function () { /* pakai data tertanam */ });
  }

  function rememberToken(token) {
    if (!token) return;
    TM_CONFIG.token = token;
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) { /* browser menolak penyimpanan */ }
  }

  function askForToken() {
    var entered = window.prompt('Masukkan token API TokoMedia');
    if (!entered) return;
    rememberToken(entered.trim());
    loadBootstrapData();
  }

  function loadLocalConfig() {
    return new Promise(function (resolve) {
      var script = document.createElement('script');
      script.src = 'config.local.js';
      script.onload = function () {
        if (window.TM_CONFIG) {
          if (window.TM_CONFIG.token) rememberToken(window.TM_CONFIG.token);
          if (window.TM_CONFIG.apiBase && !API_OVERRIDE) TM_CONFIG.apiBase = window.TM_CONFIG.apiBase;
        }
        resolve();
      };
      script.onerror = function () { resolve(); };
      document.head.appendChild(script);
    });
  }

  loadLocalConfig().then(loadBootstrapData);
})();
</script>
</body>
</html>
