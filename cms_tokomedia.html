<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMS TokoMedia — Pusat Media Nusantara</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #0f172a; background: #eef5f2; }
    body { margin: 0; padding: 20px 14px 40px; }
    main { max-width: 560px; margin: auto; background: #fff; padding: 22px; border-radius: 20px; box-shadow: 0 8px 30px #0f172a18; }
    h1 { margin-top: 0; font-size: 24px; }
    p { color: #64748b; line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; font-weight: 700; }
    input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 11px; font: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    button { width: 100%; margin-top: 18px; border: 0; border-radius: 10px; padding: 13px; color: white; background: #059669; font-weight: 700; font-size: 15px; }
    button.secondary { background: #475569; }
    #status { min-height: 24px; margin-top: 14px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>CMS Pusat Media Nusantara</h1>
    <p>Demo sederhana untuk mengubah teks Pusat Media Nusantara, judul section, dan tombol pada TokoMedia.</p>
    <form id="cmsForm">
      <label for="label">Label kecil</label>
      <input id="label" required>

      <label for="title">Judul</label>
      <textarea id="title" required></textarea>

      <label for="description">Deskripsi</label>
      <textarea id="description" required></textarea>

      <label for="primaryButton">Tombol utama</label>
      <input id="primaryButton" required>

      <label for="secondaryButton">Tombol kedua</label>
      <input id="secondaryButton" required>

      <h2 style="margin:26px 0 0;font-size:17px">Section 01 — Kategori Utama</h2>
      <label for="sec01Eyebrow">Label kecil section 01</label>
      <input id="sec01Eyebrow" required>

      <label for="sec01Title">Judul section 01</label>
      <input id="sec01Title" required>

      <label for="sec01Sub">Keterangan section 01</label>
      <input id="sec01Sub" required>

      <h2 style="margin:26px 0 0;font-size:17px">Section 02 — Eksplorasi Bahasa</h2>
      <label for="sec02Eyebrow">Label kecil section 02</label>
      <input id="sec02Eyebrow" required>

      <label for="sec02Title">Judul section 02</label>
      <input id="sec02Title" required>

      <h2 style="margin:26px 0 0;font-size:17px">Section 03 — Streaming Terkini</h2>
      <label for="sec03Eyebrow">Label kecil section 03</label>
      <input id="sec03Eyebrow" required>

      <label for="sec03Title">Judul section 03</label>
      <input id="sec03Title" required>

      <h2 style="margin:26px 0 0;font-size:17px">Tombol Lainnya</h2>
      <label for="exploreAllButton">Tombol "Jelajahi Semua Koleksi"</label>
      <input id="exploreAllButton" required>

      <label for="languageListButton">Tombol "Daftar Bahasa"</label>
      <input id="languageListButton" required>

      <button type="button" id="loadButton" class="secondary">Muat Isi Saat Ini</button>
      <button type="submit">Simpan Perubahan</button>
      <div id="status" role="status"></div>
    </form>
  </main>
  <script>
    const endpoint = 'cms_tokomedia_api.php';
    const fields = [
      'label', 'title', 'description', 'primaryButton', 'secondaryButton',
      'sec01Eyebrow', 'sec01Title', 'sec01Sub',
      'sec02Eyebrow', 'sec02Title',
      'sec03Eyebrow', 'sec03Title',
      'exploreAllButton', 'languageListButton'
    ];
    const status = document.getElementById('status');
    const form = document.getElementById('cmsForm');

    function setStatus(message, isError) {
      status.textContent = message;
      status.style.color = isError ? '#b91c1c' : '#047857';
    }

    function payload() {
      return Object.fromEntries(fields.map((field) => [field, document.getElementById(field).value.trim()]));
    }

    async function loadContent() {
      setStatus('Memuat...', false);
      try {
        const response = await fetch(endpoint, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        fields.forEach((field) => { document.getElementById(field).value = data[field] || ''; });
        setStatus('Isi berhasil dimuat.', false);
      } catch (error) {
        setStatus('Gagal memuat isi: ' + error.message, true);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      setStatus('Menyimpan...', false);
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: payload() })
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || 'Gagal menyimpan');
        setStatus('Perubahan berhasil disimpan.', false);
      } catch (error) {
        setStatus('Gagal menyimpan: ' + error.message, true);
      }
    });

    document.getElementById('loadButton').addEventListener('click', loadContent);
    loadContent();
  </script>
</body>
</html>
